name: Project checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m studio examples/clients.csv --demo
      - run: docker build -t kp-studio .
      - run: docker run --rm kp-studio
